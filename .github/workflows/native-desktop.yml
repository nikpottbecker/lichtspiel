name: Native Qt desktop preview

on:
  push:
    paths:
      - 'native/**'
      - 'electron/assets/projection-test.png'
      - '.github/workflows/native-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }} · Qt preview
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macOS
          - os: windows-latest
            target: Windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native/requirements.txt
      - run: python -m pip install -r native/requirements.txt
      - run: python -m ruff check native && python -m ruff format --check native
      - run: python -m unittest discover -s native/tests -v
      - run: python native/build.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lichtspiel-native-${{ matrix.target }}-unsigned-preview
          path: release/native/
          if-no-files-found: error
          retention-days: 14
