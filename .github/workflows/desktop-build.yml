name: Desktop preview builds

# Deliberately manual: these are unsigned test artifacts, not published releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }} · unsigned preview
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macOS
            command: npm run package:mac
          - os: windows-latest
            target: Windows
            command: npm run package:win
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lichtspiel-${{ matrix.target }}-unsigned-preview
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
          retention-days: 14
